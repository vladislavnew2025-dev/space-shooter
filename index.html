<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Space Shooter: VLADIROBUS Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        #ui { position: absolute; top: 15px; left: 15px; color: #0ff; font-size: 18px; pointer-events: none; z-index: 5; }
        #timer { position: absolute; top: 15px; right: 15px; color: #ff0; font-size: 18px; font-weight: bold; z-index: 5; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }

        .main-btn { width: 220px; padding: 12px; margin: 8px; font-size: 18px; background: transparent; border: 2px solid #0ff; color: #0ff; cursor: pointer; border-radius: 10px; text-transform: uppercase; }
        
        .shop-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: rgba(0, 255, 255, 0.1); border: 1px solid #0ff; color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .tab-btn.active { background: #0ff; color: #000; }
        
        #shop-content { width: 90%; max-width: 400px; height: 40vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .shop-item { background: #0a0a0a; border: 1px solid #333; padding: 15px; margin: 10px 0; width: 100%; border-radius: 15px; text-align: center; }
        
        #wave-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-height: 45vh; overflow-y: auto; padding: 10px; width: 95%; max-width: 500px; }
        .wave-card { background: #0a0a0a; border: 2px solid #0ff; padding: 10px; text-align: center; cursor: pointer; border-radius: 15px; }
        
        #footer { position: absolute; bottom: 10px; text-align: center; width: 100%; font-size: 13px; font-weight: bold; animation: colorShift 4s infinite alternate; }
        @keyframes colorShift { 0% { color: #600; } 100% { color: #060; } }

        .locked { opacity: 0.3; filter: grayscale(1); }
        .coins-display { color: gold; font-size: 24px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="ui" style="display:none;">KILLS: <span id="kills">0</span>/10</div>
    <div id="timer" style="display:none;">0.00s</div>

    <div id="main-menu" class="screen">
        <h1 style="color:#0ff; font-size: 45px; margin-bottom: 20px;">SPACE GAME</h1>
        <div class="coins-display">💰 COINS: <span id="main-coins">0</span></div>
        <button class="main-btn" onclick="showWaves()">Start Game</button>
        <button class="main-btn" onclick="showShop()">Shop</button>
        <button class="main-btn" style="border-color: #f00; color: #f00;" onclick="exitGame()">Exit</button>
        <div id="footer">VLADIROBUS.xYz company | Creator: VLADIROBUS753</div>
    </div>

    <div id="wave-screen" class="screen" style="display:none;">
        <button onclick="backToMain()" style="position:absolute; top:20px; right:20px; padding:5px 15px; background:transparent; border:1px solid #0ff; color:#0ff;">BACK</button>
        <h2 style="color:#0ff; margin-bottom: 20px;">CHOOSE MISSION</h2>
        <div id="wave-list"></div>
        <div style="color: #444; font-size: 12px; margin-top: 15px;">ВИБЕРІТЬ ДОСТУПНУ ХВИЛЮ</div>
    </div>

    <div id="shop-screen" class="screen" style="display:none;">
        <button onclick="backToMain()" style="position:absolute; top:20px; right:20px; padding:5px 15px; background:transparent; border:1px solid #0ff; color:#0ff;">BACK</button>
        <h1 style="color:gold; margin-bottom: 5px;">SPACE SHOP</h1>
        <div class="coins-display" style="font-size: 20px;">💰: <span id="shop-coins">0</span></div>
        <div class="shop-tabs">
            <button class="tab-btn active" id="tab-upgrades" onclick="switchTab('upgrades')">UPGRADES</button>
            <button class="tab-btn" id="tab-skins" onclick="switchTab('skins')">SKINS</button>
        </div>
        <div id="shop-content"></div>
    </div>

    <div id="win-screen" class="screen" style="display:none;">
        <h1 style="color:gold; font-size: 35px; margin:0;">MISSION COMPLETE</h1>
        <div id="win-stars" style="font-size: 50px; color: gold;"></div>
        <div id="win-reward-text" style="color:gold; font-size:24px;"></div>
        <button onclick="backToWaves()" class="main-btn" style="margin-top:20px;">CONTINUE</button>
    </div>

    <div id="fail-screen" class="screen" style="display:none;">
        <h1 style="color:#f00; font-size: 40px;">MISSION FAILED</h1>
        <button onclick="backToWaves()" class="main-btn" style="border-color:#f00; color:#f00;">TRY AGAIN</button>
    </div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const container = document.documentElement;

    let coins = Number(localStorage.getItem('coins')) || 0;
    let unlockedUpgrades = JSON.parse(localStorage.getItem('upgrades')) || { fastFire: false };
    let unlockedSkins = JSON.parse(localStorage.getItem('skins')) || { phoenix: false };
    let activeSkin = localStorage.getItem('activeSkin') || '🚀';
    let waveData = JSON.parse(localStorage.getItem('waveData')) || [
        { id: 1, reward: 50, stars: 0, unlocked: true, targetTime: 7 },
        { id: 2, reward: 100, stars: 0, unlocked: false, targetTime: 8 },
        { id: 3, reward: 120, stars: 0, unlocked: false, targetTime: 4.5 }
    ];

    let gameActive = false, currentWave = null, startTime, kills = 0, missed = 0;
    let player = { x: 0, y: 0, targetX: 0 }, bullets = [], enemies = [], starsBg = [];
    let audioCtx, shootBuf, crashBuf, shootInterval;

    function updateCoinsUI() {
        document.getElementById('main-coins').innerText = coins;
        document.getElementById('shop-coins').innerText = coins;
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const rate = audioCtx.sampleRate;
            shootBuf = audioCtx.createBuffer(1, rate * 0.1, rate);
            let s = shootBuf.getChannelData(0);
            for(let i=0; i<s.length; i++) s[i] = Math.sin(2*Math.PI*(1100*Math.exp(-35*(i/rate)))) * (1-i/s.length) * 0.08;
            crashBuf = audioCtx.createBuffer(1, rate * 0.2, rate);
            let c = crashBuf.getChannelData(0);
            for(let i=0; i<c.length; i++) c[i] = (Math.random()*2-1) * (1-i/c.length) * 0.08;
        }
    }

    function switchTab(tab) {
        document.getElementById('tab-upgrades').classList.toggle('active', tab === 'upgrades');
        document.getElementById('tab-skins').classList.toggle('active', tab === 'skins');
        renderShopItems(tab);
    }

    function renderShopItems(tab) {
        const content = document.getElementById('shop-content');
        content.innerHTML = '';
        if (tab === 'upgrades') {
            content.innerHTML = `<div class="shop-item"><div style="color:#0ff">⚡ FAST FIRE</div><div style="font-size:11px;color:#555">Стріляє швидше</div><button class="main-btn" style="width:160px;font-size:12px" onclick="buyUpgrade('fastFire', 1000)">${unlockedUpgrades.fastFire ? 'OWNED' : 'BUY 1000💰'}</button></div>`;
        } else {
            content.innerHTML = `<div class="shop-item"><div style="color:gold">🐥 PHOENIX</div><div style="font-size:11px;color:#555">Золотий скін</div><button class="main-btn" style="width:160px;font-size:12px" onclick="buySkin('phoenix', '🐥', 500)">${unlockedSkins.phoenix ? (activeSkin === '🐥' ? 'EQUIPPED' : 'EQUIP') : 'BUY 500💰'}</button></div><div class="shop-item"><div style="color:#fff">🚀 DEFAULT</div><button class="main-btn" style="width:160px;font-size:12px" onclick="useDefault()">USE</button></div>`;
        }
    }

    function buyUpgrade(type, price) { if (!unlockedUpgrades[type] && coins >= price) { coins -= price; unlockedUpgrades[type] = true; saveProgress(); switchTab('upgrades'); } }
    function buySkin(id, icon, price) { if (unlockedSkins[id]) { activeSkin = icon; saveProgress(); switchTab('skins'); } else if (coins >= price) { coins -= price; unlockedSkins[id] = true; activeSkin = icon; saveProgress(); switchTab('skins'); } }
    function useDefault() { activeSkin = '🚀'; saveProgress(); switchTab('skins'); }
    function saveProgress() { localStorage.setItem('coins', coins); localStorage.setItem('upgrades', JSON.stringify(unlockedUpgrades)); localStorage.setItem('skins', JSON.stringify(unlockedSkins)); localStorage.setItem('activeSkin', activeSkin); updateCoinsUI(); }

    function showWaves() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('wave-screen').style.display = 'flex'; renderWaves(); }
    function showShop() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('shop-screen').style.display = 'flex'; switchTab('upgrades'); updateCoinsUI(); }
    function backToMain() { document.querySelectorAll('.screen').forEach(s => s.style.display = 'none'); document.getElementById('main-menu').style.display = 'flex'; updateCoinsUI(); }
    function backToWaves() { document.querySelectorAll('.screen').forEach(s => s.style.display = 'none'); document.getElementById('wave-screen').style.display = 'flex'; renderWaves(); }
    function exitGame() { if (confirm("Вийти?")) window.location.href = "https://google.com"; }

    function renderWaves() {
        const list = document.getElementById('wave-list'); list.innerHTML = '';
        waveData.forEach(w => {
            const card = document.createElement('div'); card.className = `wave-card ${w.unlocked ? '' : 'locked'}`;
            card.innerHTML = `<h3 style="margin:0;color:#0ff">WAVE ${w.id}</h3><div style="color:gold">${'★'.repeat(w.stars)}${'☆'.repeat(3-w.stars)}</div><button style="font-size:10px;border:1px solid #0ff;background:transparent;color:#0ff;margin-top:5px;padding:3px 10px;border-radius:10px">СТАРТ</button>`;
            if(w.unlocked) card.onclick = () => { if (container.requestFullscreen) container.requestFullscreen().catch(()=>{}); startMission(w); };
            list.appendChild(card);
        });
    }

    function startMission(w) {
        initAudio(); currentWave = w; gameActive = true;
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById('ui').style.display = 'block';
        document.getElementById('timer').style.display = 'block';
        kills = 0; missed = 0; bullets = []; enemies = []; startTime = Date.now();
        init();
        if (shootInterval) clearInterval(shootInterval);
        shootInterval = setInterval(() => {
            if(gameActive) {
                bullets.push({x: player.x, y: player.y-20});
                const s = audioCtx.createBufferSource(); s.buffer = shootBuf; s.connect(audioCtx.destination); s.start();
            }
        }, unlockedUpgrades.fastFire ? 150 : 280);
        requestAnimationFrame(gameLoop);
    }

    function init() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        player.x = canvas.width / 2; player.targetX = player.x; player.y = canvas.height - 80;
        starsBg = []; for(let i=0; i<30; i++) starsBg.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
    }

    window.addEventListener('pointermove', (e) => { if(gameActive) player.targetX = e.clientX; });

    function gameLoop() {
        if(!gameActive) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        player.x += (player.targetX - player.x) * 0.2;
        let now = (Date.now() - startTime) / 1000;
        document.getElementById('timer').innerText = now.toFixed(2) + 's';
        starsBg.forEach(s => { s.y += 3; if(s.y > canvas.height) s.y = 0; });
        for(let i=bullets.length-1; i>=0; i--) { bullets[i].y -= 18; if(bullets[i].y < 0) bullets.splice(i,1); }
        if(Math.random() < 0.06) enemies.push({x: Math.random()*canvas.width, y: -50, r: 20, s: 40, i: '👾'});
        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i]; e.y += 5 + (currentWave.id === 2 ? 3 : 0);
            for(let j=bullets.length-1; j>=0; j--) {
                if(Math.hypot(e.x-bullets[j].x, e.y-bullets[j].y) < 35) {
                    const s = audioCtx.createBufferSource(); s.buffer = crashBuf; s.connect(audioCtx.destination); s.start();
                    enemies.splice(i,1); bullets.splice(j,1);
                    kills++; document.getElementById('kills').innerText = kills;
                    if(kills >= 10) { gameActive = false; endMission(); return; }
                    break;
                }
            }
            if(e && Math.hypot(e.x-player.x, e.y-player.y) < 40) { gameActive = false; document.getElementById('fail-screen').style.display = 'flex'; }
            if(e && e.y > canvas.height + 50) { enemies.splice(i,1); missed++; }
        }
    }

    function draw() {
        ctx.fillStyle = '#000510'; ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = '#666'; starsBg.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
        ctx.textAlign = 'center'; ctx.font = '50px Arial';
        ctx.fillText(activeSkin, player.x, player.y + 15);
        enemies.forEach(e => { ctx.font = '40px Arial'; ctx.fillText(e.i, e.x, e.y + 15); });
        ctx.fillStyle = '#0ff'; bullets.forEach(b => ctx.fillRect(b.x-2, b.y, 4, 20));
    }

    function endMission() {
        let timeTaken = (Date.now() - startTime) / 1000;
        let starCount = timeTaken <= currentWave.targetTime && missed === 0 ? 3 : (timeTaken <= currentWave.targetTime + 2 ? 2 : 1);
        if(starCount > currentWave.stars) currentWave.stars = starCount;
        coins += currentWave.reward;
        if(currentWave.id < waveData.length) waveData[currentWave.id].unlocked = true;
        localStorage.setItem('coins', coins); localStorage.setItem('waveData', JSON.stringify(waveData));
        document.getElementById('win-stars').innerText = '★'.repeat(starCount) + '☆'.repeat(3-starCount);
        document.getElementById('win-reward-text').innerText = `+${currentWave.reward} COINS`;
        document.getElementById('win-screen').style.display = 'flex';
        document.getElementById('ui').style.display = 'none';
        document.getElementById('timer').style.display = 'none';
    }

    updateCoinsUI();
</script>
</body>
</html>
