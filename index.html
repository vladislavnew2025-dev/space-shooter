<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Space Shooter Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; color: #fff;
            touch-action: none; /* Блокує стандартні жести браузера */
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        #top-bar {
            width: 100%; height: 40px; background: #111; 
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #333; z-index: 20; font-size: 14px; color: #555;
        }

        #game-container { position: relative; width: 100%; height: 100%; overflow: hidden; }

        #ui { position: absolute; top: 15px; left: 15px; color: #0ff; font-size: 18px; pointer-events: none; z-index: 5; }
        #timer { position: absolute; top: 15px; right: 15px; color: #ff0; font-size: 18px; font-weight: bold; pointer-events: none; z-index: 5; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }

        #wave-list {
            display: flex; flex-wrap: wrap; justify-content: center; 
            max-height: 55vh; overflow-y: auto; width: 95%; padding: 10px;
        }

        .wave-card {
            background: #0a0a0a; border: 2px solid #0ff; padding: 15px; margin: 8px;
            width: 170px; text-align: center; cursor: pointer; border-radius: 15px;
        }
        
        button { 
            padding: 12px 30px; font-size: 18px; background: transparent; 
            border: 2px solid #0ff; color: #0ff; cursor: pointer; border-radius: 30px;
            text-transform: uppercase;
        }

        #rotate-screen { display: none; background: #000; z-index: 100; text-align: center; }
        .hint { color: #555; font-size: 12px; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .locked { opacity: 0.3; filter: grayscale(1); }
    </style>
</head>
<body>

    <div id="top-bar">OFFLINE MODE READY</div>

    <div id="game-container">
        <div id="rotate-screen" class="screen">
            <div style="font-size: 50px;">📱🔄</div>
            <h2>ПОВЕРНІТЬ ТЕЛЕФОН</h2>
        </div>

        <div id="ui">KILLS: <span id="kills">0</span>/10</div>
        <div id="timer">0.00s</div>

        <div id="menu-screen" class="screen">
            <h1 style="color:#0ff; font-size: 40px; margin: 0;">START GAME</h1>
            <div style="color: gold; margin: 10px 0; font-size: 20px;">💰: <span id="coins-display">0</span></div>
            <div id="wave-list"></div>
            <div class="hint">Виберіть доступну хвилю для початку</div>
        </div>

        <div id="win-screen" class="screen">
            <h1 style="color:gold;">MISSION COMPLETE</h1>
            <div id="win-stars" style="font-size: 40px; color: gold; margin-bottom: 20px;"></div>
            <button onclick="backToMenu()">ПРОДОВЖИТИ</button>
        </div>

        <div id="fail-screen" class="screen">
            <h1 style="color:#f00; font-size: 40px;">MISSION FAILED</h1>
            <button onclick="backToMenu()" style="border-color:#f00; color:#f00;">СПРОБУВАТИ ЗНОВУ</button>
        </div>

        <canvas id="game"></canvas>
    </div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const container = document.documentElement; 
    const rotateScreen = document.getElementById('rotate-screen');
    const topBar = document.getElementById('top-bar');

    let coins = Number(localStorage.getItem('coins')) || 0;
    let waveData = JSON.parse(localStorage.getItem('waveData')) || [
        { id: 1, reward: 50, stars: 0, unlocked: true, targetTime: 7 },
        { id: 2, reward: 100, stars: 0, unlocked: false, targetTime: 8 },
        { id: 3, reward: 120, stars: 0, unlocked: false, targetTime: 4.5 }
    ];

    let gameActive = false, currentWave = null, startTime, kills = 0, missed = 0;
    let player = { x: 0, y: 0, targetX: 0 };
    let bullets = [], enemies = [], starsBg = [];
    let audioCtx, shootBuf, crashBuf;

    function checkOrientation() {
        if (window.innerHeight > window.innerWidth) {
            rotateScreen.style.display = 'flex';
            topBar.style.display = 'flex';
        } else {
            rotateScreen.style.display = 'none';
            topBar.style.display = 'none';
        }
    }
    window.addEventListener('resize', checkOrientation);
    checkOrientation();

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const rate = audioCtx.sampleRate;
            shootBuf = audioCtx.createBuffer(1, rate * 0.1, rate);
            let s = shootBuf.getChannelData(0);
            for(let i=0; i<s.length; i++) s[i] = Math.sin(2*Math.PI*(1100*Math.exp(-35*(i/rate)))) * (1-i/s.length) * 0.08;
            crashBuf = audioCtx.createBuffer(1, rate * 0.2, rate);
            let c = crashBuf.getChannelData(0);
            for(let i=0; i<c.length; i++) c[i] = (Math.random()*2-1) * (1-i/c.length) * 0.08;
        }
    }

    function renderMenu() {
        document.getElementById('coins-display').innerText = coins;
        const list = document.getElementById('wave-list');
        list.innerHTML = '';
        waveData.forEach(w => {
            const card = document.createElement('div');
            card.className = `wave-card ${w.unlocked ? '' : 'locked'}`;
            card.innerHTML = `
                <h3 style="margin:0; color:#0ff;">WAVE ${w.id}</h3>
                <div style="color:gold; letter-spacing:2px;">${'★'.repeat(w.stars)}${'☆'.repeat(3-w.stars)}</div>
                <button style="font-size:10px; padding:5px 10px; margin-top:8px;">СТАРТ</button>
            `;
            if(w.unlocked) card.onclick = (e) => {
                e.stopPropagation();
                if (container.requestFullscreen) container.requestFullscreen();
                startMission(w);
            };
            list.appendChild(card);
        });
    }

    function startMission(w) {
        initAudio();
        currentWave = w;
        gameActive = true;
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'none';
        document.getElementById('fail-screen').style.display = 'none';
        kills = 0; missed = 0; bullets = []; enemies = [];
        startTime = Date.now();
        init();
        animate();
    }

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.targetX = player.x;
        player.y = canvas.height - 80;
        starsBg = [];
        for(let i=0; i<30; i++) starsBg.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
    }

    // Керування: плавне слідування за пальцем/мишкою
    const handleMove = (e) => {
        if (!gameActive) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        player.targetX = clientX;
    };
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchstart', handleMove, { passive: false });

    function endMission() {
        gameActive = false;
        let timeTaken = (Date.now() - startTime) / 1000;
        let starCount = timeTaken <= currentWave.targetTime && missed === 0 ? 3 : (timeTaken <= currentWave.targetTime + 2 ? 2 : 1);
        if(starCount > currentWave.stars) currentWave.stars = starCount;
        coins += currentWave.reward;
        if(currentWave.id < waveData.length) waveData[currentWave.id].unlocked = true;
        localStorage.setItem('coins', coins);
        localStorage.setItem('waveData', JSON.stringify(waveData));
        document.getElementById('win-stars').innerText = '★'.repeat(starCount) + '☆'.repeat(3-starCount);
        document.getElementById('win-screen').style.display = 'flex';
        if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }

    function backToMenu() {
        document.getElementById('win-screen').style.display = 'none';
        document.getElementById('fail-screen').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'flex';
        renderMenu();
    }

    setInterval(() => {
        if(gameActive) {
            bullets.push({x: player.x, y: player.y-20});
            if(audioCtx) { const s = audioCtx.createBufferSource(); s.buffer = shootBuf; s.connect(audioCtx.destination); s.start(); }
        }
    }, 280);

    function update() {
        if(!gameActive) return;
        
        // Плавний рух корабля (згладжування)
        player.x += (player.targetX - player.x) * 0.2;

        let now = (Date.now() - startTime) / 1000;
        document.getElementById('timer').innerText = now.toFixed(2) + 's';
        
        starsBg.forEach(s => { s.y += 3; if(s.y > canvas.height) s.y = 0; });
        for(let i=bullets.length-1; i>=0; i--) {
            bullets[i].y -= 18;
            if(bullets[i].y < 0) bullets.splice(i,1);
        }

        if(Math.random() < 0.06) enemies.push({x: Math.random()*canvas.width, y: -50, r: 20, s: 40, i: '👾'});
        
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i]; e.y += 5 + (currentWave.id === 2 ? 3 : 0);
            for (let j = bullets.length - 1; j >= 0; j--) {
                if (Math.hypot(e.x - bullets[j].x, e.y - bullets[j].y) < 35) {
                    if(audioCtx) { const s = audioCtx.createBufferSource(); s.buffer = crashBuf; s.connect(audioCtx.destination); s.start(); }
                    enemies.splice(i, 1); bullets.splice(j, 1);
                    kills++; document.getElementById('kills').innerText = kills;
                    if(kills >= 10) { endMission(); return; }
                    break;
                }
            }
            if(e && Math.hypot(e.x-player.x, e.y-player.y) < 40) {
                gameActive = false;
                document.getElementById('fail-screen').style.display = 'flex';
                if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
            }
            if(e && e.y > canvas.height + 50) { enemies.splice(i,1); missed++; }
        }
    }

    function draw() {
        ctx.fillStyle = '#000510'; ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = '#666'; starsBg.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
        ctx.textAlign = 'center'; ctx.font = '50px Arial';
        ctx.fillText('🚀', player.x, player.y + 15);
        enemies.forEach(e => { ctx.font = '40px Arial'; ctx.fillText(e.i, e.x, e.y + 15); });
        ctx.fillStyle = '#0ff'; bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 20));
    }

    function animate() { update(); draw(); if(gameActive) requestAnimationFrame(animate); }

    renderMenu();
</script>
</body>
</html>
