<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Space Shooter PRO</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: 'Orbitron', sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0ff; font-size: 24px; text-shadow: 0 0 10px #0ff; pointer-events: none; }
    </style>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div id="ui">CORE_SCORE: <span id="score">0</span></div>
    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let score = 0, gameActive = true, shake = 0;
    let player = { x: 0, y: 0, w: 40, h: 40 };
    let bullets = [], enemies = [], particles = [], stars = [];

    // Звуковий рушій (працює без файлів)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height - 100;
        for(let i=0; i<50; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2});
    }

    window.addEventListener('pointermove', (e) => { player.x = e.clientX; });
    window.addEventListener('pointerdown', () => { if(!gameActive) location.reload(); });

    setInterval(() => {
        if(gameActive) {
            bullets.push({ x: player.x, y: player.y, r: 4 });
            playSound(440, 'sawtooth', 0.1);
        }
    }, 200);

    function createExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x, y, 
                vx: (Math.random()-0.5)*10, 
                vy: (Math.random()-0.5)*10, 
                life: 1, 
                color
            });
        }
        shake = 10;
    }

    function update() {
        if(!gameActive) return;
        if(shake > 0) shake *= 0.9;

        stars.forEach(s => { s.y += 2; if(s.y > canvas.height) s.y = 0; });
        bullets.forEach((b, i) => { b.y -= 12; if(b.y < 0) bullets.splice(i, 1); });
        
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if(p.life <= 0) particles.splice(i, 1);
        });

        if(Math.random() < 0.06) enemies.push({ x: Math.random()*canvas.width, y: -50, r: 15+Math.random()*25, color: `hsl(${Math.random()*360}, 70%, 60%)` });

        enemies.forEach((e, ei) => {
            e.y += 4 + (score/2000);
            bullets.forEach((b, bi) => {
                if(Math.hypot(e.x - b.x, e.y - b.y) < e.r) {
                    createExplosion(e.x, e.y, e.color);
                    playSound(100, 'square', 0.3);
                    enemies.splice(ei, 1);
                    bullets.splice(bi, 1);
                    score += 100;
                    document.getElementById('score').innerText = score;
                }
            });
            if(e.y > canvas.height + 50 || Math.hypot(e.x - player.x, e.y - player.y) < e.r + 15) {
                gameActive = false;
                alert("CORE CRITICAL FAILURE. SCORE: " + score);
                location.reload();
            }
        });
    }

    function draw() {
        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle = '#00040d';
        ctx.fillRect(0,0,canvas.width, canvas.height);

        if(shake > 1) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

        // Зірки
        ctx.fillStyle = '#fff';
        stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));

        // Гравець
        ctx.shadowBlur = 15; ctx.shadowColor = '#0ff';
        ctx.fillStyle = '#0ff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x-20, player.y+25);
        ctx.lineTo(player.x+20, player.y+25);
        ctx.fill();

        // Ефекти та вороги
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
        });
        ctx.globalAlpha = 1;

        enemies.forEach(e => {
            ctx.shadowColor = e.color;
            ctx.fillStyle = e.color;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
        });

        bullets.forEach(b => {
            ctx.fillStyle = '#ff0';
            ctx.fillRect(b.x-2, b.y, 4, 15);
        });

        requestAnimationFrame(() => { update(); draw(); });
    }

    init(); draw();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
