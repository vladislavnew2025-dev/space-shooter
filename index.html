<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Space Shooter: VLADIROBUS Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        #ui { position: absolute; top: 15px; left: 15px; color: #0ff; font-size: 18px; pointer-events: none; z-index: 5; }
        #timer { position: absolute; top: 15px; right: 15px; color: #ff0; font-size: 18px; font-weight: bold; z-index: 5; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }

        .main-btn { width: 220px; padding: 12px; margin: 8px; font-size: 18px; background: transparent; border: 2px solid #0ff; color: #0ff; cursor: pointer; border-radius: 10px; text-transform: uppercase; }
        
        .shop-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: rgba(0, 255, 255, 0.1); border: 1px solid #0ff; color: #fff; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .tab-btn.active { background: #0ff; color: #000; }
        
        #shop-content { width: 90%; max-width: 400px; height: 50vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .shop-item { background: #0a0a0a; border: 1px solid #333; padding: 15px; margin: 10px 0; width: 100%; border-radius: 15px; text-align: center; }
        
        #wave-list { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-height: 45vh; overflow-y: auto; padding: 10px; width: 95%; max-width: 500px; }
        .wave-card { background: #0a0a0a; border: 2px solid #0ff; padding: 10px; text-align: center; cursor: pointer; border-radius: 15px; }
        
        #footer { position: absolute; bottom: 10px; text-align: center; width: 100%; font-size: 13px; font-weight: bold; animation: colorShift 4s infinite alternate; }
        @keyframes colorShift { 0% { color: #600; } 100% { color: #060; } }

        .locked { opacity: 0.3; filter: grayscale(1); }
        .coins-display { color: gold; font-size: 24px; margin-bottom: 15px; }

        /* Контейнер для конфигуратора корабля */
        .ship-config-container { display: flex; position: relative; width: 100%; height: 60vh; justify-content: center; align-items: center; overflow: visible; }

        /* Выдвижные панели (Sidebars) */
        .sidebar { position: absolute; top: 0; width: 150px; height: 100%; background: rgba(5, 5, 5, 0.95); border: 1px solid #0ff; transition: transform 0.3s ease; display: flex; flex-direction: column; padding: 10px; border-radius: 10px; z-index: 15; }
        
        /* Левая панель: Магазин пушек и ячеек */
        .sidebar-left { left: -30px; transform: translateX(-75%); }
        .sidebar-left:hover, .sidebar-left:focus-within { transform: translateX(35px); }

        /* Правая панель: Инвентарь купленного */
        .sidebar-right { right: -30px; transform: translateX(75%); }
        .sidebar-right:hover, .sidebar-right:focus-within { transform: translateX(-35px); }

        /* Ярлыки для наведения */
        .sidebar-handle { position: absolute; top: 50%; transform: translateY(-50%); background: #0ff; color: #000; padding: 15px 5px; font-size: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; writing-mode: vertical-lr; letter-spacing: 1px; }
        .sidebar-left .sidebar-handle { right: -23px; }
        .sidebar-right .sidebar-handle { left: -23px; }

        /* Сетка внутри панелей */
        .side-tabs { display: flex; gap: 2px; margin-bottom: 10px; width: 100%; }
        .side-tab-btn { flex: 1; font-size: 9px; padding: 5px 2px; background: rgba(0,255,255,0.1); border: 1px solid #0ff; color: #fff; cursor: pointer; border-radius: 5px; text-transform: uppercase; text-align: center;}
        .side-tab-btn.active { background: #0ff; color: #000; }

        .side-list { flex: 1; overflow-y: auto; width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: center; }

        /* Стили для системы сетки корабля в центре */
        .grid-ui { display: grid; grid-template-columns: repeat(4, 45px); gap: 5px; background: #050505; padding: 10px; border: 2px solid #0ff; border-radius: 10px; box-shadow: 0 0 15px rgba(0,255,255,0.2); }
        .cell-ui { width: 45px; height: 45px; border: 1px solid #0ff; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(0,255,255,0.05); cursor: pointer; border-radius: 5px; transition: background 0.2s; }
        .cell-ui:not(.locked):hover { background: rgba(0,255,255,0.2); }
        .cell-ui.locked { border-color: #333; color: #333; background: #000; cursor: not-allowed; }
        
        .gun-inv { width: 42px; height: 42px; background: #ff0; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 9px; border-radius: 5px; flex-shrink: 0; cursor: pointer; border: 1px solid #fff; }
        .side-shop-btn { width: 100%; padding: 8px 2px; font-size: 9px; background: transparent; border: 1px solid #ff0; color: #ff0; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui" style="display:none;">KILLS: <span id="kills">0</span>/10</div>
    <div id="timer" style="display:none;">0.00s</div>

    <div id="main-menu" class="screen">
        <h1 style="color:#0ff; font-size: 45px; margin-bottom: 20px;">SPACE GAME</h1>
        <div class="coins-display">💰 COINS: <span id="main-coins">0</span></div>
        <button class="main-btn" onclick="showWaves()">Start Game</button>
        <button class="main-btn" onclick="showShop()">Shop</button>
        <button class="main-btn" style="border-color: #f00; color: #f00;" onclick="exitGame()">Exit</button>
        <div id="footer">VLADIROBUS.xYz company | Creator: VLADIROBUS753</div>
    </div>

    <div id="wave-screen" class="screen" style="display:none;">
        <button onclick="backToMain()" style="position:absolute; top:20px; right:20px; padding:5px 15px; background:transparent; border:1px solid #0ff; color:#0ff;">BACK</button>
        <h2 style="color:#0ff; margin-bottom: 20px;">CHOOSE MISSION</h2>
        <div id="wave-list"></div>
        <div style="color: #444; font-size: 12px; margin-top: 15px;">ВИБЕРІТЬ ДОСТУПНУ ХВИЛЮ</div>
    </div>

    <div id="shop-screen" class="screen" style="display:none;">
        <button onclick="backToMain()" style="position:absolute; top:20px; right:20px; padding:5px 15px; background:transparent; border:1px solid #0ff; color:#0ff;">BACK</button>
        <h1 style="color:gold; margin-bottom: 5px;">SPACE SHOP</h1>
        <div class="coins-display" style="font-size: 20px;">💰: <span id="shop-coins">0</span></div>
        <div class="shop-tabs">
            <button class="tab-btn active" id="tab-upgrades" onclick="switchTab('upgrades')">UPGRADES</button>
            <button class="tab-btn" id="tab-skins" onclick="switchTab('skins')">SKINS</button>
            <button class="tab-btn" id="tab-ship" onclick="switchTab('ship')">SHIP CONFIG</button>
        </div>
        <div id="shop-content"></div>
    </div>

    <div id="win-screen" class="screen" style="display:none;">
        <h1 style="color:gold; font-size: 35px; margin:0;">MISSION COMPLETE</h1>
        <div id="win-stars" style="font-size: 50px; color: gold;"></div>
        <div id="win-reward-text" style="color:gold; font-size:24px;"></div>
        <button onclick="backToWaves()" class="main-btn" style="margin-top:20px;">CONTINUE</button>
    </div>

    <div id="fail-screen" class="screen" style="display:none;">
        <h1 style="color:#f00; font-size: 40px;">MISSION FAILED</h1>
        <button onclick="backToWaves()" class="main-btn" style="border-color:#f00; color:#f00;">TRY AGAIN</button>
    </div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const container = document.documentElement;

    let coins = Number(localStorage.getItem('coins')) || 0;
    let unlockedUpgrades = JSON.parse(localStorage.getItem('upgrades')) || { fastFire: false };
    let unlockedSkins = JSON.parse(localStorage.getItem('skins')) || { phoenix: false };
    let activeSkin = localStorage.getItem('activeSkin') || '🚀';
    
    // Конфигурация корабля
    let shipGrid = JSON.parse(localStorage.getItem('shipGrid')) || Array(16).fill(null).map((_, i) => i < 4 ? 0 : null);
    let shipInventory = JSON.parse(localStorage.getItem('shipInventory')) || [1]; 
    let unlockedCells = Number(localStorage.getItem('unlockedCells')) || 4;
    
    // Внутренние вкладки для боковых панелей меню конфигурации
    let currentLeftTab = 'guns'; // 'guns' или 'cells'
    let currentRightTab = 'inv_guns'; // пока только одна вкладка, но структура готова
    let selectedGunIdx = null;

    let waveData = JSON.parse(localStorage.getItem('waveData')) || [
        { id: 1, reward: 50, stars: 0, unlocked: true, targetTime: 7 },
        { id: 2, reward: 100, stars: 0, unlocked: false, targetTime: 8 },
        { id: 3, reward: 120, stars: 0, unlocked: false, targetTime: 4.5 }
    ];

    let gameActive = false, currentWave = null, startTime, kills = 0, missed = 0;
    let player = { x: 0, y: 0, targetX: 0 }, bullets = [], enemies = [], starsBg = [];
    let audioCtx, shootBuf, crashBuf, shootInterval;

    function updateCoinsUI() {
        document.getElementById('main-coins').innerText = coins;
        document.getElementById('shop-coins').innerText = coins;
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const rate = audioCtx.sampleRate;
            shootBuf = audioCtx.createBuffer(1, rate * 0.1, rate);
            let s = shootBuf.getChannelData(0);
            for(let i=0; i<s.length; i++) s[i] = Math.sin(2*Math.PI*(1100*Math.exp(-35*(i/rate)))) * (1-i/s.length) * 0.08;
            crashBuf = audioCtx.createBuffer(1, rate * 0.2, rate);
            let c = crashBuf.getChannelData(0);
            for(let i=0; i<c.length; i++) c[i] = (Math.random()*2-1) * (1-i/c.length) * 0.08;
        }
    }

    function switchTab(tab) {
        document.getElementById('tab-upgrades').classList.toggle('active', tab === 'upgrades');
        document.getElementById('tab-skins').classList.toggle('active', tab === 'skins');
        document.getElementById('tab-ship').classList.toggle('active', tab === 'ship');
        renderShopItems(tab);
    }

    function switchSideTab(side, tab) {
        if(side === 'left') {
            currentLeftTab = tab;
        } else {
            currentRightTab = tab;
        }
        renderShopItems('ship');
    }

    function renderShopItems(tab) {
        const content = document.getElementById('shop-content');
        content.innerHTML = '';
        
        if (tab === 'upgrades') {
            content.innerHTML = `<div class="shop-item"><div style="color:#0ff">⚡ FAST FIRE</div><div style="font-size:11px;color:#555">Стріляє швидше</div><button class="main-btn" style="width:160px;font-size:12px" onclick="buyUpgrade('fastFire', 1000)">${unlockedUpgrades.fastFire ? 'OWNED' : 'BUY 1000💰'}</button></div>`;
        } else if (tab === 'skins') {
            content.innerHTML = `<div class="shop-item"><div style="color:gold">🐥 PHOENIX</div><div style="font-size:11px;color:#555">Золотий скін</div><button class="main-btn" style="width:160px;font-size:12px" onclick="buySkin('phoenix', '🐥', 500)">${unlockedSkins.phoenix ? (activeSkin === '🐥' ? 'EQUIPPED' : 'EQUIP') : 'BUY 500💰'}</button></div><div class="shop-item"><div style="color:#fff">🚀 DEFAULT</div><button class="main-btn" style="width:160px;font-size:12px" onclick="useDefault()">USE</button></div>`;
        } else if (tab === 'ship') {
            // Создаем структуру с выдвижными панелями и центральной сеткой корабля
            content.innerHTML = `
            <div class="ship-config-container">
                <div class="sidebar sidebar-left">
                    <div class="sidebar-handle">SHOP 🛒</div>
                    <div class="side-tabs">
                        <button class="side-tab-btn ${currentLeftTab==='guns'?'active':''}" onclick="switchSideTab('left','guns')">Guns</button>
                        <button class="side-tab-btn ${currentLeftTab==='cells'?'active':''}" onclick="switchSideTab('left','cells')">Cells</button>
                    </div>
                    <div class="side-list" id="left-side-list"></div>
                </div>

                <div class="grid-ui" id="g-ui"></div>

                <div class="sidebar sidebar-right">
                    <div class="sidebar-handle">ITEMS 🎒</div>
                    <div class="side-tabs">
                        <button class="side-tab-btn active" style="font-size:8px;">MY GUNS</button>
                    </div>
                    <div class="side-list" id="right-side-list"></div>
                </div>
            </div>`;
            
            // Заполняем Левую Панель (Магазин)
            const leftList = document.getElementById('left-side-list');
            if (currentLeftTab === 'guns') {
                leftList.innerHTML = `
                    <div style="font-size:10px; text-align:center; color:#ff0;">LASER GUN</div>
                    <button onclick="buyShipItem('gun', 1500)" class="side-shop-btn">BUY<br>1500💰</button>
                `;
            } else {
                leftList.innerHTML = `
                    <div style="font-size:10px; text-align:center; color:#0ff;">SHIP CELL</div>
                    <div style="font-size:9px; color:#666;">(${unlockedCells}/16 open)</div>
                    <button onclick="buyShipItem('cell', 3000)" class="side-shop-btn" ${unlockedCells >= 16 ? 'disabled style="border-color:#333;color:#333;"' : ''}>${unlockedCells >= 16 ? 'MAX' : 'BUY<br>3000💰'}</button>
                `;
            }

            // Заполняем Центральную сетку корабля
            const gDiv = document.getElementById('g-ui');
            shipGrid.forEach((s, i) => {
                const c = document.createElement('div');
                c.className = 'cell-ui' + (s===null?' locked':'');
                c.innerHTML = s===1?'🔫':(s===null?'🔒':'');
                c.onclick = () => {
                    if(s===null) return;
                    // Если выбрана пушка из инвентаря и ячейка пустая — устанавливаем её
                    if(selectedGunIdx!==null && s===0) { 
                        shipGrid[i]=1; 
                        shipInventory.splice(selectedGunIdx,1); 
                        selectedGunIdx=null; 
                    }
                    // Если кликнули по установленной пушке — снимаем в инвентарь
                    else if(s===1) { 
                        shipGrid[i]=0; 
                        shipInventory.push(1); 
                    }
                    saveProgress(); renderShopItems('ship');
                };
                gDiv.appendChild(c);
            });

            // Заполняем Правую Панель (Инвентарь купленного оружия)
            const rightList = document.getElementById('right-side-list');
            if (shipInventory.length === 0) {
                rightList.innerHTML = '<span style="color:#444; font-size:10px; text-align:center; margin-top:20px;">EMPTY</span>';
            }
            shipInventory.forEach((_, i) => {
                const g = document.createElement('div');
                g.className = 'gun-inv'; g.innerHTML = '<span style="font-size:14px;">🔫</span><span>GUN</span>';
                if(selectedGunIdx===i) g.style.border = '2px solid #0ff';
                g.onclick = () => { 
                    selectedGunIdx = (selectedGunIdx === i) ? null : i; 
                    renderShopItems('ship'); 
                };
                rightList.appendChild(g);
            });
        }
    }

    function buyUpgrade(type, price) { if (!unlockedUpgrades[type] && coins >= price) { coins -= price; unlockedUpgrades[type] = true; saveProgress(); switchTab('upgrades'); } }
    function buySkin(id, icon, price) { if (unlockedSkins[id]) { activeSkin = icon; saveProgress(); switchTab('skins'); } else if (coins >= price) { coins -= price; unlockedSkins[id] = true; activeSkin = icon; saveProgress(); switchTab('skins'); } }
    
    function buyShipItem(type, price) {
        if(coins < price) return;
        if(type === 'gun') { coins -= price; shipInventory.push(1); }
        if(type === 'cell' && unlockedCells < 16) { coins -= price; shipGrid[unlockedCells] = 0; unlockedCells++; }
        saveProgress(); renderShopItems('ship');
    }
    
    function useDefault() { activeSkin = '🚀'; saveProgress(); switchTab('skins'); }
    
    function saveProgress() { 
        localStorage.setItem('coins', coins); 
        localStorage.setItem('upgrades', JSON.stringify(unlockedUpgrades)); 
        localStorage.setItem('skins', JSON.stringify(unlockedSkins)); 
        localStorage.setItem('activeSkin', activeSkin); 
        localStorage.setItem('shipGrid', JSON.stringify(shipGrid));
        localStorage.setItem('shipInventory', JSON.stringify(shipInventory));
        localStorage.setItem('unlockedCells', unlockedCells);
        updateCoinsUI(); 
    }

    function showWaves() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('wave-screen').style.display = 'flex'; renderWaves(); }
    function showShop() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('shop-screen').style.display = 'flex'; switchTab('upgrades'); updateCoinsUI(); }
    function backToMain() { document.querySelectorAll('.screen').forEach(s => s.style.display = 'none'); document.getElementById('main-menu').style.display = 'flex'; updateCoinsUI(); }
    function backToWaves() { document.querySelectorAll('.screen').forEach(s => s.style.display = 'none'); document.getElementById('wave-screen').style.display = 'flex'; renderWaves(); }
    function exitGame() { if (confirm("Вийти?")) window.location.href = "https://google.com"; }

    function renderWaves() {
        const list = document.getElementById('wave-list'); list.innerHTML = '';
        waveData.forEach(w => {
            const card = document.createElement('div'); card.className = `wave-card ${w.unlocked ? '' : 'locked'}`;
            card.innerHTML = `<h3 style="margin:0;color:#0ff">WAVE ${w.id}</h3><div style="color:gold">${'★'.repeat(w.stars)}${'☆'.repeat(3-w.stars)}</div><button style="font-size:10px;border:1px solid #0ff;background:transparent;color:#0ff;margin-top:5px;padding:3px 10px;border-radius:10px">СТАРТ</button>`;
            if(w.unlocked) card.onclick = () => { if (container.requestFullscreen) container.requestFullscreen().catch(()=>{}); startMission(w); };
            list.appendChild(card);
        });
    }

    function startMission(w) {
        initAudio(); currentWave = w; gameActive = true;
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById('ui').style.display = 'block';
        document.getElementById('timer').style.display = 'block';
        kills = 0; missed = 0; bullets = []; enemies = []; startTime = Date.now();
        init();
        if (shootInterval) clearInterval(shootInterval);
        shootInterval = setInterval(() => {
            if(gameActive) {
                let hasGuns = false;
                
                // Стрельба на основе конфигурации сетки
                shipGrid.forEach((s, i) => {
                    if(s===1) {
                        hasGuns = true;
                        let r = Math.floor(i/4), c = i%4;
                        // Смещение пули зависит от колонки (c) и ряда (r) в сетке под размер корабля
                        bullets.push({x: player.x + (c - 1.5) * 32, y: player.y - 45 + r * 20});
                    }
                });
                
                if (!hasGuns) bullets.push({x: player.x, y: player.y - 20});

                const s = audioCtx.createBufferSource(); s.buffer = shootBuf; s.connect(audioCtx.destination); s.start();
            }
        }, unlockedUpgrades.fastFire ? 150 : 280);
        requestAnimationFrame(gameLoop);
    }

    function init() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        player.x = canvas.width / 2; player.targetX = player.x; player.y = canvas.height - 100;
        starsBg = []; for(let i=0; i<30; i++) starsBg.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
    }

    window.addEventListener('pointermove', (e) => { if(gameActive) player.targetX = e.clientX; });

    function gameLoop() {
        if(!gameActive) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        player.x += (player.targetX - player.x) * 0.2;
        let now = (Date.now() - startTime) / 1000;
        document.getElementById('timer').innerText = now.toFixed(2) + 's';
        starsBg.forEach(s => { s.y += 3; if(s.y > canvas.height) s.y = 0; });
        for(let i=bullets.length-1; i>=0; i--) { bullets[i].y -= 18; if(bullets[i].y < 0) bullets.splice(i,1); }
        if(Math.random() < 0.06) enemies.push({x: Math.random()*canvas.width, y: -50, r: 20, s: 40, i: '👾'});
        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i]; e.y += 5 + (currentWave.id === 2 ? 3 : 0);
            for(let j=bullets.length-1; j>=0; j--) {
                if(Math.hypot(e.x-bullets[j].x, e.y-bullets[j].y) < 35) {
                    const s = audioCtx.createBufferSource(); s.buffer = crashBuf; s.connect(audioCtx.destination); s.start();
                    enemies.splice(i,1); bullets.splice(j,1);
                    kills++; document.getElementById('kills').innerText = kills;
                    if(kills >= 10) { gameActive = false; endMission(); return; }
                    break;
                }
            }
            if(e && Math.hypot(e.x-player.x, e.y-player.y) < 40) { gameActive = false; document.getElementById('fail-screen').style.display = 'flex'; }
            if(e && e.y > canvas.height + 50) { enemies.splice(i,1); missed++; }
        }
    }

    function draw() {
        ctx.fillStyle = '#000510'; ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = '#666'; starsBg.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
        
        // ВЫЧИСЛЕНИЕ РАЗМЕРА ДИНАМИЧЕСКОГО КОРАБЛЯ НА ОСНОВЕ СЕТКИ
        // Считаем сколько колонок и рядов реально разблокировано (минимум 1х1, максимум 4х4)
        let maxCols = 1, maxRows = 1;
        shipGrid.forEach((cell, idx) => {
            if (cell !== null) {
                let r = Math.floor(idx / 4) + 1;
                let c = (idx % 4) + 1;
                if (c > maxCols) maxCols = c;
                if (r > maxRows) maxRows = r;
            }
        });

        let cellW = 32, cellH = 25;
        let shipW = maxCols * cellW;
        let shipH = maxRows * cellH;

        // Рисуем подложку корабля (энергетический щит/корпус под размер ячеек)
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(0, 255, 255, 0.05)';
        
        // Корпус центрируется по координате player.x
        let shipLeft = player.x - shipW / 2;
        let shipTop = player.y - shipH / 2;
        
        ctx.beginPath();
        ctx.roundRect(shipLeft, shipTop, shipW, shipH, 8);
        ctx.fill();
        ctx.stroke();

        // Отрисовка пушек на корпусе корабля, если они установлены
        shipGrid.forEach((s, i) => {
            if(s === 1) {
                let r = Math.floor(i / 4);
                let c = i % 4;
                // Позиционируем пушку ровно в ту виртуальную ячейку, где она стоит
                let gunX = player.x + (c - 1.5) * cellW;
                let gunY = player.y - shipH / 2 + (r * cellH) + 10;
                
                ctx.fillStyle = '#ff0';
                ctx.fillRect(gunX - 4, gunY - 12, 8, 16); // Дуло пушки
                ctx.fillStyle = '#0ff';
                ctx.fillRect(gunX - 6, gunY - 2, 12, 6);   // Основание пушки
            }
        });
        
        // Центрируем и рисуем основной скин (эмодзи) поверх нашего расширяемого корпуса
        ctx.textAlign = 'center'; 
        ctx.font = '36px Arial';
        ctx.fillText(activeSkin, player.x, player.y + 12);
        
        // Отрисовка врагов
        enemies.forEach(e => { ctx.font = '40px Arial'; ctx.fillText(e.i, e.x, e.y + 15); });
        
        // Отрисовка пуль
        ctx.fillStyle = '#0ff'; bullets.forEach(b => ctx.fillRect(b.x-2, b.y, 4, 20));
    }

    function endMission() {
        let timeTaken = (Date.now() - startTime) / 1000;
        let starCount = timeTaken <= currentWave.targetTime && missed === 0 ? 3 : (timeTaken <= currentWave.targetTime + 2 ? 2 : 1);
        if(starCount > currentWave.stars) currentWave.stars = starCount;
        coins += currentWave.reward;
        if(currentWave.id < waveData.length) waveData[currentWave.id].unlocked = true;
        localStorage.setItem('coins', coins); localStorage.setItem('waveData', JSON.stringify(waveData));
        document.getElementById('win-stars').innerText = '★'.repeat(starCount) + '☆'.repeat(3-starCount);
        document.getElementById('win-reward-text').innerText = `+${currentWave.reward} COINS`;
        document.getElementById('win-screen').style.display = 'flex';
        document.getElementById('ui').style.display = 'none';
        document.getElementById('timer').style.display = 'none';
    }

    updateCoinsUI();
</script>
</body>
</html>
