<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <title>Space Shooter: VLADIROBUS Edition</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }

        #ui { position: absolute; top: 15px; left: 15px; color: #0ff; font-size: 18px; pointer-events: none; z-index: 5; }
        #timer { position: absolute; top: 15px; right: 15px; color: #ff0; font-size: 18px; font-weight: bold; z-index: 5; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }

        /* ГОЛОВНЕ МЕНЮ */
        .main-btn { width: 220px; padding: 15px; margin: 10px; font-size: 20px; background: transparent; border: 2px solid #0ff; color: #0ff; cursor: pointer; border-radius: 10px; text-transform: uppercase; }
        .main-btn:hover { background: #0ff; color: #000; }

        /* МАГАЗИН */
        #shop-screen { display: none; }

        /* СПИСОК ХВИЛЬ */
        #wave-list { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            max-height: 50vh; 
            overflow-y: auto; 
            padding: 10px; 
            width: 95%; 
            max-width: 500px;
        }

        .wave-card { background: #0a0a0a; border: 2px solid #0ff; padding: 10px; text-align: center; cursor: pointer; border-radius: 15px; }
        .stars { color: gold; font-size: 18px; }
        
        /* ПЕРЕЛИВАННЯ ФУТЕРА */
        #footer { 
            position: absolute; 
            bottom: 10px; 
            text-align: center; 
            width: 100%; 
            font-size: 13px; 
            font-weight: bold;
            letter-spacing: 1px;
            animation: colorShift 4s infinite alternate;
        }

        @keyframes colorShift {
            0% { color: #600; }    /* Темно-червоний */
            100% { color: #060; }  /* Темно-зелений */
        }

        .locked { opacity: 0.3; filter: grayscale(1); }
        .coins-display { color: gold; font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
    </style>
</head>
<body>

    <div id="ui">KILLS: <span id="kills">0</span>/10</div>
    <div id="timer">0.00s</div>

    <!-- ГОЛОВНЕ МЕНЮ -->
    <div id="main-menu" class="screen">
        <h1 style="color:#0ff; font-size: 50px; margin-bottom: 30px;">SPACE GAME</h1>
        <div class="coins-display">💰 COINS: <span id="main-coins">0</span></div>
        <button class="main-btn" onclick="showWaves()">Start Game</button>
        <button class="main-btn" onclick="showShop()">Shop</button>
        <button class="main-btn" style="border-color: #f00; color: #f00;" onclick="exitGame()">Exit</button>
        
        <div id="footer">
            VLADIROBUS.xYz company | Creator: VLADIROBUS753
        </div>
    </div>

    <!-- ВИБІР ХВИЛЬ -->
    <div id="wave-screen" class="screen" style="display:none;">
        <button onclick="backToMain()" style="position:absolute; top:20px; right:20px; padding:5px 15px; font-size:14px; background: transparent; border: 1px solid #0ff; color: #0ff;">BACK</button>
        <h2 style="color:#0ff; margin-bottom: 20px;">CHOOSE MISSION</h2>
        <div id="wave-list"></div>
        <div style="color: #444; font-size: 12px; margin-top: 15px;">ВИБЕРІТЬ ДОСТУПНУ ХВИЛЮ</div>
    </div>

    <!-- МАГАЗИН -->
    <div id="shop-screen" class="screen">
        <button onclick="backToMain()" style="position:absolute; top:20px; right:20px; padding:5px 15px; font-size:14px; background: transparent; border: 1px solid #0ff; color: #0ff;">BACK</button>
        <h2 style="color:gold; margin-bottom: 10px;">SPACE SHOP</h2>
        <div class="coins-display">💰: <span id="shop-coins">0</span></div>
        <p style="color: #555;">Тут будуть твої апгрейди...</p>
    </div>

    <!-- ЕКРАН ПЕРЕМОГИ -->
    <div id="win-screen" class="screen" style="display:none;">
        <h1 style="color:gold;">MISSION COMPLETE</h1>
        <div id="win-stars" style="font-size: 50px; color: gold; margin-bottom: 20px;"></div>
        <button onclick="backToWaves()" style="background: transparent; border: 2px solid #0ff; color: #0ff; padding: 10px 20px;">CONTINUE</button>
    </div>

    <!-- ЕКРАН ПРОГРАШУ -->
    <div id="fail-screen" class="screen" style="display:none;">
        <h1 style="color:#f00; font-size: 40px;">MISSION FAILED</h1>
        <button onclick="backToWaves()" style="border-color:#f00; color:#f00; background: transparent; padding: 10px 20px;">TRY AGAIN</button>
    </div>

    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const container = document.documentElement;

    let coins = Number(localStorage.getItem('coins')) || 0;
    let waveData = JSON.parse(localStorage.getItem('waveData')) || [
        { id: 1, reward: 50, stars: 0, unlocked: true, targetTime: 7 },
        { id: 2, reward: 100, stars: 0, unlocked: false, targetTime: 8 },
        { id: 3, reward: 120, stars: 0, unlocked: false, targetTime: 4.5 }
    ];

    let gameActive = false, currentWave = null, startTime, kills = 0, missed = 0;
    let player = { x: 0, y: 0, targetX: 0 }, bullets = [], enemies = [], starsBg = [];
    let audioCtx, shootBuf, crashBuf;

    function updateCoinsUI() {
        document.getElementById('main-coins').innerText = coins;
        document.getElementById('shop-coins').innerText = coins;
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const rate = audioCtx.sampleRate;
            shootBuf = audioCtx.createBuffer(1, rate * 0.1, rate);
            let s = shootBuf.getChannelData(0);
            for(let i=0; i<s.length; i++) s[i] = Math.sin(2*Math.PI*(1100*Math.exp(-35*(i/rate)))) * (1-i/s.length) * 0.08;
            crashBuf = audioCtx.createBuffer(1, rate * 0.2, rate);
            let c = crashBuf.getChannelData(0);
            for(let i=0; i<c.length; i++) c[i] = (Math.random()*2-1) * (1-i/c.length) * 0.08;
        }
    }

    function showWaves() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('wave-screen').style.display = 'flex';
        renderWaves();
    }

    function showShop() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('shop-screen').style.display = 'flex';
        updateCoinsUI();
    }

    function backToMain() {
        document.getElementById('wave-screen').style.display = 'none';
        document.getElementById('shop-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
        updateCoinsUI();
    }

    function renderWaves() {
        const list = document.getElementById('wave-list');
        list.innerHTML = '';
        waveData.forEach(w => {
            const card = document.createElement('div');
            card.className = `wave-card ${w.unlocked ? '' : 'locked'}`;
            card.innerHTML = `
                <h3 style="margin:0; color:#0ff;">WAVE ${w.id}</h3>
                <div class="stars">${'★'.repeat(w.stars)}${'☆'.repeat(3-w.stars)}</div>
                <button style="font-size:10px; padding:5px 10px; margin-top:5px; border-radius:10px; background: transparent; border: 1px solid #0ff; color: #0ff;">СТАРТ</button>
            `;
            if(w.unlocked) card.onclick = () => {
                if (container.requestFullscreen) container.requestFullscreen().catch(()=>{});
                startMission(w);
            };
            list.appendChild(card);
        });
    }

    function exitGame() {
        if (confirm("Вийти з гри?")) {
            window.location.href = "https://google.com";
        }
    }

    function startMission(w) {
        initAudio();
        currentWave = w;
        gameActive = true;
        document.getElementById('wave-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'none';
        document.getElementById('fail-screen').style.display = 'none';
        kills = 0; missed = 0; bullets = []; enemies = [];
        startTime = Date.now();
        init();
        animate();
    }

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.targetX = player.x;
        player.y = canvas.height - 80;
        starsBg = [];
        for(let i=0; i<30; i++) starsBg.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2});
    }

    window.addEventListener('pointermove', (e) => {
        if(gameActive) player.targetX = e.clientX;
    });

    function endMission() {
        gameActive = false;
        let timeTaken = (Date.now() - startTime) / 1000;
        let starCount = timeTaken <= currentWave.targetTime && missed === 0 ? 3 : (timeTaken <= currentWave.targetTime + 2 ? 2 : 1);
        if(starCount > currentWave.stars) currentWave.stars = starCount;
        coins += currentWave.reward;
        if(currentWave.id < waveData.length) waveData[currentWave.id].unlocked = true;
        localStorage.setItem('coins', coins);
        localStorage.setItem('waveData', JSON.stringify(waveData));
        document.getElementById('win-stars').innerText = '★'.repeat(starCount) + '☆'.repeat(3-starCount);
        document.getElementById('win-screen').style.display = 'flex';
    }

    function backToWaves() {
        document.getElementById('win-screen').style.display = 'none';
        document.getElementById('fail-screen').style.display = 'none';
        document.getElementById('wave-screen').style.display = 'flex';
        renderWaves();
    }

    function animate() {
        if(!gameActive) return;
        ctx.fillStyle = '#000510'; ctx.fillRect(0,0,canvas.width, canvas.height);
        player.x += (player.targetX - player.x) * 0.2;
        let now = (Date.now() - startTime) / 1000;
        document.getElementById('timer').innerText = now.toFixed(2) + 's';
        starsBg.forEach(s => { s.y += 3; if(s.y > canvas.height) s.y = 0; });
        ctx.fillStyle = '#666'; starsBg.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
        for(let i=bullets.length-1; i>=0; i--) {
            bullets[i].y -= 18;
            if(bullets[i].y < 0) bullets.splice(i,1);
        }
        if(Math.random() < 0.06) enemies.push({x: Math.random()*canvas.width, y: -50, r: 20, s: 40, i: '👾'});
        for(let i=enemies.length-1; i>=0; i--) {
            let e = enemies[i]; e.y += 5 + (currentWave.id === 2 ? 3 : 0);
            for(let j=bullets.length-1; j>=0; j--) {
                if(Math.hypot(e.x-bullets[j].x, e.y-bullets[j].y) < 35) {
                    const s = audioCtx.createBufferSource(); s.buffer = crashBuf; s.connect(audioCtx.destination); s.start();
                    enemies.splice(i,1); bullets.splice(j,1);
                    kills++; document.getElementById('kills').innerText = kills;
                    if(kills >= 10) { endMission(); return; }
                    break;
                }
            }
            if(e && Math.hypot(e.x-player.x, e.y-player.y) < 40) {
                gameActive = false;
                document.getElementById('fail-screen').style.display = 'flex';
            }
            if(e && e.y > canvas.height + 50) { enemies.splice(i,1); missed++; }
        }
        ctx.textAlign = 'center'; ctx.font = '50px Arial';
        ctx.fillText('🚀', player.x, player.y + 15);
        enemies.forEach(e => { ctx.font = '40px Arial'; ctx.fillText(e.i, e.x, e.y + 15); });
        ctx.fillStyle = '#0ff'; bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 20));
        requestAnimationFrame(animate);
    }

    setInterval(() => {
        if(gameActive) {
            bullets.push({x: player.x, y: player.y-20});
            if(audioCtx) { const s = audioCtx.createBufferSource(); s.buffer = shootBuf; s.connect(audioCtx.destination); s.start(); }
        }
    }, 280);

    updateCoinsUI();
</script>
</body>
</html>
